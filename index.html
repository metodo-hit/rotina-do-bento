<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rotina do Bento</title>
  <meta name="description" content="Mamadas, sonecas, agenda e marcos do Bento.">

  <!-- Aparência de app no iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bento">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FAF6EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B2028" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="app.css?v=2">
</head>
<body>
  <div id="app">
    <header class="topo">
      <div class="topo-titulo">
        <h1 id="titulo">Rotina do Bento</h1>
        <p id="idade" class="topo-idade"></p>
      </div>
      <button id="status-sync" class="status-sync" type="button" aria-label="Estado da sincronização">
        <span class="status-ponto"></span>
        <span class="status-texto">…</span>
      </button>
    </header>

    <div id="player-yt" class="player-yt" hidden></div>

    <main id="conteudo" tabindex="-1"></main>

    <nav class="abas" aria-label="Navegação">
      <button type="button" data-aba="hoje" class="ativa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Hoje</span>
      </button>
      <button type="button" data-aba="sono">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        <span>Sono</span>
      </button>
      <button type="button" data-aba="agenda">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Agenda</span>
      </button>
      <button type="button" data-aba="marcos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
        <span>Marcos</span>
      </button>
      <button type="button" data-aba="mais">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>Mais</span>
      </button>
    </nav>
  </div>

  <div id="folha" class="folha-fundo" hidden>
    <div class="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
      <div class="folha-alca" aria-hidden="true"></div>
      <div id="folha-conteudo"></div>
    </div>
  </div>

  <div id="alarme" class="alarme" hidden></div>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="sono.js?v=2"></script>
  <script src="agenda.js?v=2"></script>
  <script src="marcos.js?v=2"></script>
  <script src="extras.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
